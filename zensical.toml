[project]
site_name = "claude-router"
site_description = "A local HTTP router between Claude Code and any LLM provider."
site_url = "https://spielernogard.github.io/claude-router/"
repo_url = "https://github.com/SpielerNogard/claude-router"
repo_name = "SpielerNogard/claude-router"
copyright = "MIT License · Copyright © 2026 Christopher Müller"
nav = [
  { "Overview" = "index.md" },
  { "Getting started" = "getting-started.md" },
  { "Configuration" = "configuration.md" },
  { "Claude Code integration" = "claude-code.md" },
  { "Web UI" = "web-ui.md" },
  { "Reference" = "reference.md" },
  { "Security" = "security.md" },
  { "Development" = "development.md" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "navigation.footer",
  "navigation.instant",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
tables = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
